# Panel de contenido de Cerraya (Decap CMS) en cerraya.com/admin
# Inicia sesión con GitHub a través del proveedor OAuth de Netlify (ver README).
backend:
  name: github
  repo: Innnovader/CERRAYA
  branch: main
  base_url: https://api.netlify.com
  commit_messages:
    create: 'Trabajo nuevo: {{slug}}'
    update: 'Actualiza trabajo: {{slug}}'
    delete: 'Elimina trabajo: {{slug}}'
    uploadMedia: 'Sube foto: {{path}}'
    deleteMedia: 'Elimina foto: {{path}}'

locale: es
site_url: https://cerraya.com
display_url: https://cerraya.com
logo_url: https://cerraya.com/img/logo-cerraya.png

# Las fotos se guardan en src/assets para que Astro las optimice (webp, varios tamaños).
media_folder: src/assets/trabajos
public_folder: ../../assets/trabajos

collections:
  - name: trabajos
    label: Trabajos
    label_singular: Trabajo
    description: Fotos de los trabajos que aparecen en cerraya.com/trabajos
    folder: src/content/trabajos
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: '{{titulo}} · {{servicio}}'
    sortable_fields: ['fecha', 'titulo']
    fields:
      - { label: Título, name: titulo, widget: string, hint: 'Ej: Cerradura digital Yale en apartamento de Cedritos' }
      - { label: Fecha, name: fecha, widget: datetime, date_format: 'DD/MM/YYYY', time_format: false, format: 'YYYY-MM-DD' }
      - label: Servicio
        name: servicio
        widget: select
        options: ['Urgencia', 'Cerradura digital', 'Cambio de guardas', 'Cerrojo de seguridad', 'Caja fuerte', 'Vehículo', 'Conjunto o empresa', 'Otro']
      - { label: Localidad o barrio, name: localidad, widget: string, required: false }
      - { label: Foto principal (después), name: foto, widget: image, choose_url: false }
      - { label: Foto de antes (opcional), name: antes, widget: image, required: false, choose_url: false }
      - { label: Destacar en el inicio, name: destacado, widget: boolean, default: false, required: false }
      - { label: Descripción, name: body, widget: markdown, required: false, buttons: ['bold', 'italic', 'bulleted-list'], editor_components: [] }
